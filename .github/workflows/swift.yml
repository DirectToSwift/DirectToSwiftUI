name: Build and Test

on:
  push:
  pull_request:
  schedule:
    - cron: "15 8 * * 1"

jobs:
  nextstep:
    runs-on: macos-latest
    steps:
      - name: Select latest available Xcode
        uses: maxim-lobanov/setup-xcode@v1.5.1
        with:
          xcode-version: latest
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Build Swift Debug Package
        run: swift build -c debug
      - name: Build Swift Release Package
        run: swift build -c release
      - name: Build Xcode Project for iOS
        run: >-
          xcodebuild -project DirectToSwiftUI.xcodeproj
          -scheme DirectToSwiftUI-Mobile -destination generic/platform=iOS
          -configuration Debug CODE_SIGNING_ALLOWED=NO
      - name: Build Xcode Project for watchOS
        run: >-
          xcodebuild -project DirectToSwiftUI.xcodeproj
          -scheme DirectToSwiftUI-Watch -destination generic/platform=watchOS
          -configuration Debug CODE_SIGNING_ALLOWED=NO
